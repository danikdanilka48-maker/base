<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base. — система жизни</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#f1e6d3;--bg2:#efc9b8;--ink:#1d1b18;--mute:#8a8174;--card:rgba(255,255,255,.58);--line:rgba(60,45,25,.11);--pill:rgba(90,110,150,.16);--sh:0 10px 30px rgba(90,60,20,.08)}
body[data-theme="dark"]{--bg:#15130f;--bg2:#2a1d18;--ink:#f3ece0;--mute:#9b9284;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--pill:rgba(255,255,255,.1);--sh:none}
body[data-theme="ocean"]{--bg:#eaf1f8;--bg2:#cfe1f2;--ink:#101f33;--mute:#647894;--card:rgba(255,255,255,.62);--line:rgba(20,50,90,.12);--pill:rgba(45,100,190,.16);--sh:0 10px 30px rgba(20,50,90,.08)}
body[data-theme="mint"]{--bg:#eaf6ee;--bg2:#c8e9d2;--ink:#12281c;--mute:#5f8069;--card:rgba(255,255,255,.62);--line:rgba(20,80,45,.12);--pill:rgba(35,140,90,.16);--sh:0 10px 30px rgba(20,80,45,.08)}
body[data-theme="rose"]{--bg:#f8edf1;--bg2:#f1c9db;--ink:#2c1520;--mute:#8f6c7d;--card:rgba(255,255,255,.62);--line:rgba(90,20,55,.11);--pill:rgba(200,60,130,.15);--sh:0 10px 30px rgba(90,20,55,.08)}
.theme-swatches{display:flex;gap:10px;margin:4px 0 18px}.theme-swatch{width:36px;height:36px;border-radius:50%;box-shadow:var(--sh);border:2px solid transparent}.theme-swatch.on{border-color:var(--ink)}
.theme-swatch[data-theme="warm"]{background:linear-gradient(135deg,#f1e6d3,#efc9b8)}.theme-swatch[data-theme="dark"]{background:linear-gradient(135deg,#15130f,#2a1d18)}.theme-swatch[data-theme="ocean"]{background:linear-gradient(135deg,#eaf1f8,#cfe1f2)}.theme-swatch[data-theme="mint"]{background:linear-gradient(135deg,#eaf6ee,#c8e9d2)}.theme-swatch[data-theme="rose"]{background:linear-gradient(135deg,#f8edf1,#f1c9db)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:500 14px/1.45 Manrope,Inter,system-ui,sans-serif;background:radial-gradient(rgba(0,0,0,.04) 1px,transparent 1px) 0 0/4px 4px,radial-gradient(900px 600px at 95% 100%,var(--bg2),transparent),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
h1,h2,h3,p{margin:0}h1{font-size:30px;font-weight:700;letter-spacing:-.02em}h3{font-size:16px}
.app-shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:26px 14px;display:flex;flex-direction:column;gap:6px}
.brand{font-size:20px;font-weight:800;padding:0 12px 22px}
.nav{display:grid;gap:2px}.sidebar-bottom{margin-top:auto;display:grid;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:var(--mute);text-align:left;width:100%;position:relative}
.nav-item:hover{background:var(--line)}.nav-item.active{background:var(--pill);color:var(--ink);font-weight:700}
.nav-item.active:before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:#3b6cf0}
.nav-item small{margin-left:auto;font-size:11px}.nav-icon{width:18px;text-align:center}
.user{display:flex;gap:10px;align-items:center;padding:14px 12px 0}.user span{display:block;color:var(--mute);font-size:12px}
.avatar{width:32px;height:32px;border-radius:50%;background:#7c3aed;color:#fff;display:grid;place-items:center;font-weight:700}
body.collapsed .app-shell{grid-template-columns:72px 1fr}body.collapsed .nav-item{font-size:0}body.collapsed .nav-icon{font-size:16px}body.collapsed .nav-item small,body.collapsed .user div:last-child,body.collapsed .brand{display:none}
.main-content{padding:22px 40px 130px;max-width:1300px;width:100%}
.topbar{display:flex;justify-content:flex-end;align-items:center;min-height:44px}.mobile-menu{display:none;margin-right:auto;font-size:20px}
.focus-pill{display:flex;align-items:center;gap:10px;background:var(--card);padding:6px 8px 6px 10px;border-radius:999px;box-shadow:var(--sh)}
.focus-pill .ring{width:22px;height:22px;border:2px solid #3b6cf0;border-radius:50%}.focus-pill small{display:block;font-size:10px;color:var(--mute);line-height:1}.focus-pill b{font-size:15px}
.focus-pill button{width:28px;height:28px;border-radius:50%;background:var(--pill);font-size:11px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:8px 0 22px}
.eyebrow{font-size:11px;letter-spacing:.1em;color:var(--mute);margin-bottom:6px}.intro{color:var(--mute);margin-top:4px}.head-actions{display:flex;gap:10px}
.primary-button{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700}
.outline-button{background:var(--card);padding:10px 16px;border-radius:999px;box-shadow:var(--sh);font-weight:600}
.text-button{color:var(--mute);font-weight:600}.danger-link{color:#d94b3d;font-weight:600}
.chip{background:var(--card);padding:7px 14px;border-radius:999px;font-weight:600;box-shadow:var(--sh)}
.score{margin-bottom:8px}.score-row{display:flex;align-items:center;gap:14px;margin:12px 0 10px}.score-num{font-size:64px;line-height:1;font-weight:700;letter-spacing:-.04em}
.score-row small{display:block;color:var(--mute)}.score-bar{position:relative;display:flex;gap:6px;width:270px}.score-bar u{height:14px;border-radius:8px;flex:1}
.score-bar u:nth-child(1){background:#f5b7a5}.score-bar u:nth-child(2){background:#f3d3a0}.score-bar u:nth-child(3){background:#c5cbd6}.score-bar u:nth-child(4){background:#a9d69a}
.score-bar i{position:absolute;top:-6px;width:2px;height:26px;background:var(--ink);border-radius:2px;transition:left .3s}
.score-scale{display:flex;width:270px;justify-content:space-between;color:var(--mute);font-size:11px;margin-top:6px}
.tabs-line{display:flex;gap:22px;margin:18px 0 16px;border-bottom:1px solid var(--line)}.tabs-line button{padding:8px 0;color:var(--mute);font-weight:600}.tabs-line .on{color:var(--ink);border-bottom:2px solid var(--ink)}
.dash{display:grid;grid-template-columns:1fr 1fr .85fr;gap:16px}
.card,.content-panel,.panel,.money-card,.health-card,.macro,.macro-main,.note-card,.habit-card,.calendar-board,.calendar-side,.meal-row,.chat-panel,.assistant-sidebar,.habit-hero,.workout-overview article,.nutrition-overview{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:20px;position:relative;backdrop-filter:blur(8px)}
.card{min-height:170px;display:flex;flex-direction:column}.card h2{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:6px 0 auto}.card h2 small{font-size:18px;color:var(--mute);font-weight:500}
.card p{font-size:13px;opacity:.75}.blue{background:linear-gradient(135deg,#1e4fd8,#7c3aed);color:#fff}.orange{background:linear-gradient(135deg,#f0683a,#f6a15a);color:#fff}
.ico{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.22);display:grid;place-items:center;margin-bottom:auto}.light .ico{background:var(--line)}
.go{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.25);color:inherit}.light .go{background:var(--ink);color:var(--bg)}
.card-foot{display:flex;justify-content:space-between;font-size:12px;opacity:.9}.card-foot b{display:block;font-size:14px}.card-foot .r{text-align:right}
.mini-dashes{display:flex;gap:4px;margin:10px 0 6px}.mini-dashes i{width:22px;height:4px;border-radius:3px;background:var(--ink)}.mini-dashes .empty{background:var(--line)}
.card-note,.habit-summary{color:var(--mute);font-size:12px}
.chart{grid-column:1/3}.chart svg{width:100%;height:150px;margin-top:8px}.legend-2{display:flex;gap:14px;color:var(--mute);font-size:12px;float:right}
.chart-dates{display:flex;justify-content:space-between;color:var(--mute);font-size:11px}
.hb-row{display:flex;gap:6px;margin:auto 0 8px;flex-wrap:wrap}.hb{width:30px;height:30px;border-radius:50%;background:var(--line);color:var(--mute)}.hb.on{background:var(--ink);color:var(--bg)}
.task{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.task input{display:none}
.checkmark{width:20px;height:20px;border:2px solid var(--mute);border-radius:7px;flex:none}.task.done .checkmark{background:var(--ink);border-color:var(--ink)}.task.done .task-title{text-decoration:line-through;color:var(--mute)}
.tag{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--pill)}.time{color:var(--mute);font-size:12px}.task-title{flex:1}
.progress-track,.macro-line,.sleep-scale,.budget-line,.thin-bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}.progress-track i,.macro-line i,.sleep-scale i,.budget-line i,.thin-bar i{display:block;height:100%;background:var(--ink)}
.task-progress{margin:14px 0}.task-progress>div:first-child{display:flex;justify-content:space-between;margin-bottom:6px}
.add-line{width:100%;padding:12px;color:var(--mute);text-align:left;font-weight:600}.empty-state{padding:24px;text-align:center;color:var(--mute)}
.panel-heading{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}.panel-kicker{font-size:11px;letter-spacing:.1em;color:var(--mute)}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{padding:7px 14px;border-radius:999px;background:var(--line)}.tab.selected{background:var(--ink);color:var(--bg)}
.habit-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}.habit-item span:nth-child(2){flex:1}.habit-item i{font-style:normal}
.habit-symbol{width:34px;height:34px;border-radius:12px;background:var(--pill);display:grid;place-items:center;flex:none}
.habits-grid,.notes-grid,.health-grid,.money-overview,.workout-overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.habit-card{display:flex;gap:14px;align-items:center}.habit-card div{flex:1}.habit-card>button{font-size:22px}.habit-card.is-done{opacity:.7}.streak{color:var(--mute);font-size:12px}
.habit-hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.habit-hero h2{font-size:44px}
.habit-ring{width:90px;height:90px;border-radius:50%;background:conic-gradient(var(--ink) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}.habit-ring i{font-style:normal;background:var(--bg);width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.calendar-layout,.finance-grid,.assistant-layout{display:grid;grid-template-columns:1fr 300px;gap:16px}
.calendar-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}.calendar-mode{margin-left:auto;display:flex;gap:4px}.calendar-mode button{padding:6px 12px;border-radius:999px}.calendar-mode .selected{background:var(--ink);color:var(--bg)}
.round-control,.today-control{padding:6px 12px;border-radius:999px;background:var(--line)}
.day-grid{display:grid;grid-template-columns:52px 1fr;height:640px}.hour-column{padding-top:45px}.hour-column span{display:block;height:64px;color:var(--mute);font-size:12px}
.events-column{position:relative;background:linear-gradient(var(--line) 1px,transparent 1px) 0 45px/100% 64px}.hour-line{display:none}
.now-line{position:absolute;left:0;right:0;border-top:2px solid #e5484d;z-index:2}.now-line span{position:absolute;right:0;top:-10px;background:#e5484d;color:#fff;font-size:10px;padding:1px 6px;border-radius:6px}
.calendar-event{position:absolute;left:8px;right:8px;border-radius:12px;padding:8px 12px;text-align:left;overflow:hidden}.calendar-event span{display:block;font-size:12px;opacity:.7}
.violet{background:#e3dcfa}.blue.calendar-event{background:#d5e2fb;color:var(--ink)}.sand{background:#f3e3bd}.coral{background:#f8d2c6}.green{background:#d3ecc9}.calendar-event{color:#1d1b18}
.connect-inline{display:flex;gap:8px;width:100%;padding:12px;margin-top:12px;border-radius:14px;background:var(--line);text-align:left}.connect-inline b{margin-left:auto}.side-divider{height:1px;background:var(--line);margin:16px 0}
.agenda-list div{display:flex;gap:8px;align-items:center;padding:6px 0}.agenda-list i{width:8px;height:8px;border-radius:50%}.sync-chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--pill);margin:4px 4px 0 0}
.notes-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--mute)}.notes-search{display:flex;gap:8px;background:var(--card);padding:8px 14px;border-radius:999px}.notes-search input{border:0;background:none;outline:0}
.note-card{cursor:pointer;min-height:170px}.note-card p{color:var(--mute);margin:8px 0}.note-card>div{display:flex;justify-content:space-between}.lilac{background:#e9e1fb}.butter{background:#f6ecc0}.mint{background:#d6efdd}.peach{background:#f8d9c9}.note-card{color:#1d1b18}
.new-note-card{border:2px dashed var(--line);border-radius:24px;min-height:170px;display:grid;place-content:center;gap:4px;color:var(--mute)}
.money-card h2,.workout-overview h2,.macro-main h2,.health-card h2{font-size:34px;letter-spacing:-.02em}small{color:var(--mute);font-weight:500}.positive{color:#2e9e5b}
.transaction,.workout-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.transaction>div,.workout-row>div{flex:1}.transaction small,.workout-row small{display:block}.income{color:#2e9e5b}
.transaction-icon,.meal-icon,.workout-row>span{width:34px;height:34px;border-radius:12px;background:var(--pill);display:grid;place-items:center}
.donut{width:150px;height:150px;border-radius:50%;margin:16px auto;background:conic-gradient(#f0683a 0 42%,#3b6cf0 0 73%,#a9d69a 0);display:grid;place-items:center}.donut div{background:var(--bg);width:104px;height:104px;border-radius:50%;display:grid;place-content:center;text-align:center}
.legend{display:grid;gap:6px}.legend span{display:flex;justify-content:space-between}
.nutrition-overview{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:16px;margin-bottom:16px;background:none;box-shadow:none;padding:0}.macro i{display:block;height:6px;border-radius:6px;margin-top:8px;background:linear-gradient(90deg,var(--ink) calc(var(--value)*1%),var(--line) 0)}
.meal-list{display:grid;gap:12px}.meal-row{display:flex;gap:14px;align-items:center}.meal-row>div{flex:1}.meal-row>button{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg)}.meal-pending{opacity:.6}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:80px}.bar-chart i{flex:1;background:var(--ink);border-radius:6px}
.water-glasses,.mood-row{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.water-glasses button,.mood-row button{width:34px;height:34px;border-radius:10px;background:var(--line)}.water-glasses .filled{background:#3b6cf0;color:#fff}.mood-row .selected{background:var(--ink)}
.weight-chart{display:flex;gap:6px;align-items:flex-end;height:40px}.weight-chart i{flex:1;height:60%;background:var(--line);border-radius:4px}
.assistant-layout{grid-template-columns:280px 1fr}.assistant-sidebar button{display:block;width:100%;text-align:left;padding:10px 14px;margin-top:8px;border-radius:12px;background:var(--line)}.assistant-orb{font-size:28px}
.chat-panel{display:flex;flex-direction:column;height:560px}.chat-head{display:flex;justify-content:space-between;margin-bottom:12px}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
.message{max-width:78%;padding:10px 14px;border-radius:16px;background:var(--line)}.message.user{align-self:flex-end;background:var(--ink);color:var(--bg)}
.chat-input{display:flex;gap:8px;margin-top:12px}.chat-input input{flex:1;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);outline:0}.chat-input button{width:42px;border-radius:50%;background:var(--ink);color:var(--bg)}
.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;z-index:20}
.dock-search{display:flex;align-items:center;gap:10px;min-width:340px;padding:12px 18px;border-radius:999px;background:var(--card);backdrop-filter:blur(14px);box-shadow:var(--sh);color:var(--mute);border:1px solid var(--line)}.dock-search kbd{margin-left:auto;font:600 11px inherit;background:var(--line);padding:2px 6px;border-radius:6px}.dock-search kbd+kbd{margin-left:0}
.dock-add{background:#1d1b18;color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}body.dark .dock-add{background:#f3ece0;color:#15130f}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,15,5,.4);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--bg);border-radius:26px;padding:28px;width:min(460px,100%);position:relative;max-height:92vh;overflow:auto}.modal h2{margin:4px 0 14px}.modal-close{position:absolute;right:16px;top:12px;font-size:24px}
.modal-overline{font-size:11px;letter-spacing:.1em;color:var(--mute)}.modal-copy,.privacy{color:var(--mute)}.modal-icon{font-size:26px}
.modal label{display:grid;gap:6px;margin-bottom:12px;font-weight:600;font-size:13px}.modal input,.modal select,.modal textarea,.task-input{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);width:100%;outline:0}.modal textarea{min-height:110px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.task-modal-actions{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:8px}
.provider{display:flex;gap:12px;align-items:center;width:100%;padding:14px;margin-top:10px;border-radius:16px;background:var(--card);text-align:left;border:1px solid var(--line)}.provider i{margin-left:auto;font-style:normal}.hidden-file{display:none}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;transition:.25s;z-index:60}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1000px){.dash,.calendar-layout,.finance-grid,.assistant-layout,.nutrition-overview{grid-template-columns:1fr}.chart{grid-column:auto}}
@media(max-width:790px){.app-shell{display:block}.sidebar{position:fixed;z-index:40;width:250px;background:var(--bg);transform:translateX(-100%);transition:.2s}.sidebar.mobile-open{transform:none}.mobile-menu{display:inline-flex}.main-content{padding:16px 16px 130px}.dock-search{min-width:0}.dock-search kbd{display:none}.page-head{flex-direction:column;align-items:flex-start}}

.cal-grid{display:grid;grid-template-columns:52px repeat(var(--n),minmax(0,1fr))}.cal-head{text-align:center;padding:4px 2px 10px;border-bottom:1px solid var(--line);min-height:64px}.cal-head small{display:block;color:var(--mute);text-transform:uppercase;font-size:10px}.cal-head b{font-size:18px;display:inline-grid;place-items:center;min-width:32px;height:32px}
.cal-head.is-today b,.month-cell.is-today b{background:var(--ink);color:var(--bg);border-radius:50%}.cal-grid .hour-column{padding:0}.cal-grid .hour-column span{height:48px}
.cal-col{position:relative;height:768px;border-left:1px solid var(--line);background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 48px;cursor:cell}.cal-col.is-today{background-color:rgba(59,108,240,.05)}
.cal-col .calendar-event{padding:4px 8px;font-size:12px;border-radius:10px;right:auto;box-shadow:0 0 0 1px rgba(255,255,255,.6) inset}.cal-col .calendar-event b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.month-head,.month-grid{display:grid;grid-template-columns:repeat(7,1fr)}.month-head span{text-align:center;color:var(--mute);font-size:11px;padding:6px}
.month-cell{min-height:100px;border:1px solid var(--line);margin:-1px 0 0 -1px;padding:6px;cursor:pointer;font-size:11px;overflow:hidden}.month-cell.out{opacity:.4}.month-cell b{display:inline-grid;place-items:center;min-width:22px;height:22px}
.mini-ev,.allday{display:block;width:100%;padding:1px 6px;border-radius:6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1d1b18;text-align:left;font-size:11px}
.mini-ev.blue,.allday.blue,.ag-row i.blue{background:#d5e2fb;color:#1d1b18}.ag-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}.ag-row i{width:8px;height:8px;border-radius:50%;flex:none}.ag-row b{min-width:64px;font-size:12px}.ag-row span{flex:1}
.agenda-card{grid-column:1/-1;min-height:0}.agenda-card h3{margin-bottom:8px}.calendar-board{overflow-x:auto}

<script>/* Base is intentionally framework-free: it can be opened directly from a file

const $ = (selector, parent = document) => parent.querySelector(selector);

};

function clone(value) { return JSON.parse(JSON.stringify(value)); }
function readStore() {
  try { return { ...clone(initialData), ...JSON.parse(localStorage.getItem('365-life-os') || 'null') }; }
  catch { return clone(initialData); }
}
let data = readStore(); data.focus = data.focus || { min: 0, sessions: 0 };
const pad = (n) => String(n).padStart(2, '0'); const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; }; const mondayOf = (d) => addDays(d, -((d.getDay() + 6) % 7)); const mins = (t) => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));
let calView = 'week', calDate = new Date(); const HOUR0 = 7, HOURS = 16, PX = 48;
data.events.forEach((e) => { e.date = e.date || iso(today); });
function save() {
  try { localStorage.setItem('365-life-os', JSON.stringify(data)); }
  catch { showToast('Данные останутся в этой сессии — браузер ограничил хранилище.'); }
}
function uid(prefix) { return `${prefix}${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`; }
function escapeHTML(value = '') { return String(value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;' })[char]); }
function showToast(message) { toast.textContent = message; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 3000); }
function doneTasks() { return data.tasks.filter((task) => task.done).length; }
function doneHabits() { return data.habits.filter((habit) => habit.done).length; }
function percent(part, total) { return total ? Math.round((part / total) * 100) : 0; }
function plural(n, [one, few, many]) { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? many : b > 1 && b < 5 ? few : b === 1 ? one : many; }
function nowLine() { const n = new Date(), m = n.getHours() * 60 + n.getMinutes() - HOUR0 * 60; if (m < 0 || m > HOURS * 60) return ''; return `<div class="now-line" style="top:${m * PX / 60}px"><span>${pad(n.getHours())}:${pad(n.getMinutes())}</span></div>`; }
const FOCUS = 25 * 60000; let focusEnd = 0, focusTimer;
function paintFocus() { const t = $('#focusTime'); if (!t) return; const s = Math.ceil((focusEnd ? Math.max(0, focusEnd - Date.now()) : FOCUS) / 1000); t.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; const b = $('[data-action="start-focus"]'); if (b) b.textContent = focusEnd ? '■' : '▶'; }
function stopFocus(finished) { const used = finished ? FOCUS : Math.max(0, FOCUS - (focusEnd - Date.now())); data.focus.min += Math.floor(used / 60000); if (finished) data.focus.sessions++; focusEnd = 0; clearInterval(focusTimer); save(); render(); }
function toggleFocus() { if (focusEnd) { stopFocus(false); showToast('Фокус остановлен.'); return; } focusEnd = Date.now() + FOCUS; focusTimer = setInterval(() => { if (Date.now() >= focusEnd) { stopFocus(true); showToast('Сессия завершена. Отличная работа!'); } else paintFocus(); }, 1000); showToast('Фокус запущен: 25 минут.'); paintFocus(); }
function searchModal() { openModal({ className: 'task-modal', html: `<p class="modal-overline">ПОИСК</p><h2>Найти в Base</h2><input class="task-input" id="globalSearch" placeholder="Задачи, заметки, события…" autocomplete="off"><div class="search-results" id="searchResults"></div>` }); }
function runSearch(query) { const q = query.trim().toLowerCase(); const box = $('#searchResults'); if (!box) return; const pool = [...data.tasks.map((x) => ({ view: 'Задачи', title: x.title, text: x.title })), ...data.notes.map((x) => ({ view: 'Заметки', title: x.title, text: `${x.title} ${x.body}` })), ...data.events.map((x) => ({ view: 'Календарь', title: x.title, text: x.title })), ...data.habits.map((x) => ({ view: 'Привычки', title: x.title, text: x.title })), ...data.transactions.map((x) => ({ view: 'Финансы', title: x.title, text: x.title }))]; const hits = q ? pool.filter((x) => x.text.toLowerCase().includes(q)).slice(0, 8) : []; box.innerHTML = q && !hits.length ? '<div class="empty-state">Ничего не найдено.</div>' : hits.map((x) => `<button class="search-hit" data-navigate="${x.view}"><b>${escapeHTML(x.title)}</b><small>${x.view}</small></button>`).join(''); }
function settingsModal() { const g = data.integrations; const theme = document.body.dataset.theme || 'warm'; openModal({ className: 'task-modal', html: `<p class="modal-overline">НАСТРОЙКИ</p><h2>Профиль, ИИ и данные</h2><p class="modal-copy align-left">Оформление</p><div class="theme-swatches">${['warm','dark','ocean','mint','rose'].map((t) => `<button type="button" class="theme-swatch ${theme === t ? 'on' : ''}" data-action="set-theme" data-theme="${t}"></button>`).join('')}</div><form data-form="profile"><label>Как к тебе обращаться<input name="name" value="${escapeHTML(data.profile.name)}" maxlength="30" required></label><div class="task-modal-actions"><button class="outline-button">Сохранить имя</button></div></form><form data-form="ai"><label>Ключ Groq — бесплатно на console.groq.com/keys<input name="key" type="password" autocomplete="off" value="${escapeHTML(g.groqKey || '')}" placeholder="gsk_…"></label><label>Модель<input name="model" list="groq-models" value="${escapeHTML(g.groqModel || GROQ_DEFAULT)}"></label><datalist id="groq-models">${GROQ_MODELS.map((m) => `<option value="${m}">`).join('')}</datalist><p class="modal-copy align-left">Ключ хранится только в этом браузере и не попадает в резервную копию.</p><div class="task-modal-actions"><button class="primary-button">Сохранить ИИ</button></div></form><div class="task-modal-actions"><button type="button" class="danger-link" data-action="reset-data">Сбросить</button><button type="button" class="outline-button" data-action="clear-all">Чистый лист</button><button type="button" class="outline-button" data-action="export-data">↓ Копия</button><button type="button" class="outline-button" data-action="pick-backup">↑ Восстановить</button></div><input class="hidden-file" type="file" accept="application/json,.json" data-action="backup-file">` }); }
function eventColor(index) { return ['violet', 'blue', 'sand', 'coral', 'green'][index % 5]; }
function categoryClass(category) { return ({ 'Работа': 'work', 'Здоровье': 'health', 'Финансы': 'finance', 'Дизайн': 'design', 'Личное': 'life' })[category] || 'life'; }

function pageFrame({ label, title, subtitle = '', actions = '' }) {
  return `<header class="topbar"><button class="mobile-menu" aria-label="Меню">☰</button><div class="focus-pill"><span class="ring"></span><span><small>Фокус</small><b id="focusTime">25:00</b></span><button data-action="start-focus" aria-label="Фокус">▶</button></div></header><section class="page-head"><div><p class="eyebrow">${label.toUpperCase()}</p><h1>${title}</h1>${subtitle ? `<p class="intro">${subtitle}</p>` : ''}</div><div class="head-actions">${actions}</div></section>`;
}
function taskItem(task, dense = false) {
  return `<label class="task ${task.done ? 'done' : ''} ${dense ? 'dense-task' : ''}"><input type="checkbox" data-action="toggle-task" data-id="${task.id}" ${task.done ? 'checked' : ''}><span class="checkmark"></span><span class="task-title">${escapeHTML(task.title)}</span><span class="tag ${categoryClass(task.category)}">${escapeHTML(task.category)}</span>${task.time ? `<span class="time">${task.time}</span>` : ''}<span class="row-actions"><button type="button" class="row-btn" data-action="edit-task" data-id="${task.id}" aria-label="Изменить">✎</button><button type="button" class="row-btn" data-action="delete-task" data-id="${task.id}" aria-label="Удалить">×</button></span></label>`;
}

function dashboard() {
  const hr = new Date().getHours(), hello = hr < 6 ? 'Доброй ночи' : hr < 12 ? 'Доброе утро' : hr < 18 ? 'Добрый день' : 'Добрый вечер';
  const todays = data.events.filter((e) => e.date === iso(today)).sort((a, b) => a.start.localeCompare(b.start)); const done = doneTasks(), hd = doneHabits(), score = percent(done + hd, data.tasks.length + data.habits.length), f = data.focus;
  const exp = data.transactions.filter((t) => t.amount < 0), spent = -exp.reduce((s, t) => s + t.amount, 0), subs = -exp.filter((t) => /подписк/i.test(t.title)).reduce((s, t) => s + t.amount, 0);
  const prev = [46, 52, 50, 61, 58, 34, 38, 60, 66, 52, 48, 64, 70, 56], now = [30, 44, 40, 55, 62, 28, 30, 52, 58, 46, 40, 60, 64, percent(hd, data.habits.length)];
  const pts = (a) => a.map((v, i) => `${(i * 600 / 13).toFixed(1)},${(125 - v * 1.15).toFixed(1)}`).join(' '); const lx = 600, ly = 125 - now[13] * 1.15, streak = Math.max(...data.habits.map((h) => h.streak));
  return pageFrame({ label: dateLabel.format(today), title: `${hello}, ${escapeHTML(data.profile.name)}!`, subtitle: 'Начнём с главного.', actions: `<button class="outline-button" data-action="open-settings">⚙ Настроить</button>` }) + `
    <section class="score"><button class="chip" data-action="open-habits">Счёт дня ⌄</button><div class="score-row"><b class="score-num">${score}</b><div><strong>${score < 40 ? 'Тяжёлый день' : score < 70 ? 'Хороший день' : 'Отличный день'}</strong><small>обновлено только что</small></div></div><div class="score-bar"><u></u><u></u><u></u><u></u><i style="left:${Math.min(99, score)}%"></i></div><div class="score-scale"><span>0</span><span>40</span><span>60</span><span>80</span></div></section>
    <nav class="tabs-line"><button class="on">Сегодня</button><button data-action="calendar-nav">Неделя</button><button data-action="open-habits">Итоги</button></nav>
    <section class="dash">
      <article class="card blue"><span class="ico">◷</span><button class="go" data-navigate="Календарь">↗</button><p>В фокусе сегодня</p><h2>${f.min} мин</h2><div class="card-foot"><span>Подходов<b>${f.sessions}</b></span><span class="r">Цель<b>1 ч 40</b></span></div></article>
      <article class="card orange"><span class="ico">◍</span><button class="go" data-navigate="Финансы">↗</button><p>Потрачено в сентябре</p><h2>${spent.toLocaleString('uk-UA')} грн</h2><div class="card-foot"><span>Подписки<b>${subs.toLocaleString('uk-UA')} грн</b></span><span class="r">Осталось<b>${Math.max(0, 20000 - spent).toLocaleString('uk-UA')} грн</b></span></div></article>
      <article class="card light"><span class="ico">✓</span><button class="go" data-navigate="Задачи">↗</button><p>Задачи закрыты</p><h2>${done}<small>/${data.tasks.length}</small></h2><div class="mini-dashes">${data.tasks.map((t) => `<i class="${t.done ? '' : 'empty'}"></i>`).join('')}</div><span class="card-note">осталось ${data.tasks.length - done}</span></article>
      <article class="card light chart"><div class="legend-2"><span>● Сейчас</span><span>○ Прошлые 2 недели</span></div><h3>Продуктивность</h3><small>выполнение привычек, % · 2 недели</small><svg viewBox="0 0 600 140" preserveAspectRatio="none"><polyline points="${pts(prev)}" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="2" stroke-dasharray="5 5"/><polyline points="${pts(now)}" fill="none" stroke="currentColor" stroke-width="2.5"/></svg><div class="chart-dates"><span>${shortDate.format(addDays(today, -13))}</span><span>Сейчас: ${now[13]}%</span><span>${shortDate.format(today)}</span></div></article>
      <article class="card light"><span class="ico">◌</span><button class="go" data-navigate="Привычки">↗</button><p>Привычки сегодня</p><h2>${hd}<small>/${data.habits.length}</small></h2><div class="hb-row">${data.habits.map((h) => `<button class="hb ${h.done ? 'on' : ''}" data-action="toggle-habit" data-id="${h.id}" title="${escapeHTML(h.title)}">${h.icon}</button>`).join('')}</div><span class="card-note">${hd ? `серия: ${streak} ${plural(streak, ['день', 'дня', 'дней'])}` : 'начните серию'}</span></article>
      <article class="card light agenda-card"><button class="go" data-navigate="Календарь">↗</button><h3>Сегодня в календаре</h3>${todays.slice(0, 4).map((e) => `<div class="ag-row"><i class="${e.color}"></i><b>${e.allDay ? 'весь день' : e.start}</b><span>${escapeHTML(e.title)}</span></div>`).join('') || '<p class="card-note">Сегодня событий нет — свободный день.</p>'}<button class="add-line" data-action="open-event-modal">＋ Событие</button></article>
    </section>`;
}
